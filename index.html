<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Quêtes</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>RPG Quêtes</h1>
    <section id="fichePersonnage">
        <h2>Fiche de personnage</h2>
        <p>Nom : <span id="nomPersonnage"></span></p>
        <p>Classe : <span id="classePersonnage"></span></p>
        <p>Niveau : <span id="niveauPersonnage"></span></p>
        <p>Magie : <span id="magiePersonnage"></span></p>
        <p>Force : <span id="forcePersonnage"></span></p>
        <p>Pieces d'or : <span id="piecePersonnage"></span></p>
        <p>Clé : <span id="clePersonnage"></span></p>
        <p>Chapeau : <span id="chapeauPersonnage"></span></p>
    </section>
    <section id="combats">
        <h2>Combats</h2>
        <button id="btnLoup">Loup</button>
        <button id="btnFantome">Fantome</button>
        <button id="btnPaladin">Paladin</button>
    </section>
    <section id="marchand">
        <h2>Marchand</h2>
        <button id="btnCle">Clé</button>
        <button id="btnChapeau">Chapeau</button>
    </section>
    <section id="boss">
        <h2>Boss</h2>
        <button id="btnBoss">Boss</button>
    </section>
    <section id="messages">
        <h2>Messages</h2>
        <p id="message"></p>
    </section>
<script src="./script.js"></script>
</body>
</html>
